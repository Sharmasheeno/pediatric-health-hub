services:
  - type: web
    name: pediatric-health-hub-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://pediatric-health-hub-web.onrender.com

  - type: web
    name: pediatric-health-hub-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pediatric-health-hub-api-proxy.sharmacadenuur2017.workers.dev/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
